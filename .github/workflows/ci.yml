name: Frontend CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'refactor/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  test-and-build:
    name: Test, Build, and E2E Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode Sumber
        uses: actions/checkout@v4

      - name: Pasang Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalasi Dependensi
        run: npm ci

      - name: Jalankan Unit Test Frontend
        run: npm test

      - name: Kompilasi Production Build Astro
        env:
          PUBLIC_API_BASE_URL: http://localhost:8082/api/v1
        run: npm run build

      - name: Pasang Browser Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Jalankan E2E Smoke Test
        env:
          PUBLIC_API_BASE_URL: http://localhost:8082/api/v1
        run: npm run test:e2e -- e2e/smoke.spec.ts

      - name: Unggah Laporan Playwright Jika Gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
